server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The browser only ever talks to this origin, and nginx forwards the API calls
    # on to the backend container. Same origin means no CORS to configure, and the
    # frontend build needs no knowledge of where the API is hosted.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
